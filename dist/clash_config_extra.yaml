- name: 🇭🇰 香港节点
  include-all: true
  filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇯🇵 日本节点
  include-all: true
  filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇺🇲 美国节点
  include-all: true
  filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇹🇼 台湾节点
  include-all: true
  filter: (?i)台|新北|彰化|TW|Taiwan
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇸🇬 狮城节点
  include-all: true
  filter: (?i)新加坡|坡|狮城|SG|Singapore
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇰🇷 韩国节点
  include-all: true
  filter: (?i)KR|Korea|KOR|首尔|韩|韓
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇮🇩 印度尼西亚节点
  include-all: true
  filter: (?i)ID|Indonesia|印度尼西亚|印尼|雅加达
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇲🇾 马来西亚节点
  include-all: true
  filter: (?i)MY|Malaysia|马来|吉隆坡
  type: url-test
  interval: 300
  tolerance: 50
- name: 🇹🇭 泰国节点
  include-all: true
  filter: (?i)TH|Thailand|泰国|曼谷
  type: url-test
  interval: 300
  tolerance: 50
- name: 🌐 其他地区
  include-all: true
  exclude-filter: (?i)港|HK|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United
    States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓|ID|Indonesia|印度尼西亚|印尼|雅加达|MY|Malaysia|马来|吉隆坡|TH|Thailand|泰国|曼谷
  type: url-test
  interval: 300
  tolerance: 50
